name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: 2

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Verify locked dependency notices
        run: python scripts/collect_dependency_notices.py --check
      - name: Test distribution guards
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Review explicit source selection
        run: python scripts/source_manifest.py --stage target/source-review --report target/source-review-manifest.json

  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint Rust
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --release --locked
      - name: Run bounded release smoke gate
        run: python3 scripts/release_smoke.py --oxible target/release/oxible --report target/release-smoke.json
      - name: Check Rust dependency advisories
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo audit

  editor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=moderate
      - name: Build native server for the real editor test
        working-directory: .
        run: cargo build --release --locked
      - name: Test the real VS Code client and native server
        run: xvfb-run -a node run-live-test.js ../../target/release/oxible ../../target/editor-live.json
